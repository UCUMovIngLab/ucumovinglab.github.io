---
layout: default
---
<section class="page-head band--light">
  <div class="container">
    <span class="rule" aria-hidden="true"></span>
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
    <h1>{{ page.title }}</h1>
  </div>
</section>
<article class="container post prose">
  {{ content }}
</article>
