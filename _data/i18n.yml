  home:
    eyebrow: "Biomecánica · Control motor · Rehabilitación · Digitalización"
    title: "Estudiamos cómo se produce y se controla el movimiento, y usamos lo que aprendemos para ayudar a las personas a recuperarlo."
    lede: "Modelamos el cuerpo y el sistema nervioso, desarrollamos instrumentos de bajo costo para medir el movimiento fuera del laboratorio, y diseñamos herramientas de rehabilitación para personas que se recuperan de lesiones neurológicas como el ACV. Facultad de Ingeniería y Tecnologías, Universidad Católica del Uruguay."
    cta_research: "Nuestra investigación"
    cta_join: "Trabajar con nosotros"
    figure_label: "Fotogramas de un ciclo de marcha con marcadores de captura de movimiento, sobre los ángulos de flexión de rodilla y cadera a lo largo del ciclo"
    figure_caption: "Fig. 1 — Un ciclo de marcha de la pierna derecha, plano sagital. Marcadores en cadera, rodilla, tobillo, punta del pie y hombro; flexión de rodilla y cadera (forma normativa, esquema)."
    research_label: "Investigación"
    research_title: "Tres líneas de investigación"
    pubs_label: "Publicaciones"
    pubs_title: "Publicaciones recientes"
