  home:
    tagline: "We study how movement is produced and controlled, and use what we learn to help people recover it."
    cta_research: "Our research"
    cta_join: "Work with us"
    about_title: "About the lab"
    about_lede: "We model the body and the nervous system, build low-cost instruments that measure movement outside the lab, and design rehabilitation tools for people recovering from neurological injury such as stroke."
    about_body: "We are part of the Facultad de Ingeniería y Tecnologías at Universidad Católica del Uruguay, and work with UCU’s microelectronics, artificial intelligence and physical therapy groups, and with Duke University."
    figure_label: "Frames of one walking gait cycle with motion-capture markers, above the knee and hip flexion angles across the cycle"
    figure_caption: "One gait cycle of the right leg in the sagittal plane, with knee and hip flexion angles (normative shape, schematic)."
    lines_title: "Research lines"
    projects_title: "Current projects"
    band: "We work with <strong>Duke University</strong>, <strong>Universidad Iberoamericana</strong> and UCU’s <strong>μDIE microelectronics</strong>, <strong>informatics</strong> and <strong>physical therapy</strong> groups, on projects funded by <strong>ANII</strong> and the <strong>US National Institutes of Health</strong>."
    pubs_title: "Recent publications and preprints"
    team_title: "Team"
    team_card_title: "Students, alumni and collaborators"
    team_card_text: "GRAD graduate students, UGRAD undergraduate research interns, ALUMNI alumni, and COLLAB collaborators at UCU, Duke University and elsewhere."
    join_title: "Interested in joining or collaborating?"
    join_text: "If you'd like to do a thesis with us, collaborate on a project, or bring us a clinical question about movement, write to either principal investigator with a few lines about your background and what you'd like to work on."

  research:
    lede: "Our goal is to understand how movement is produced and controlled, and to use that understanding to help people move better. That covers the mechanics of the body, how the nervous system coordinates muscles, and how it uses visual, vestibular and proprioceptive information to keep balance and to adapt when conditions change."
    approach: |-
      Much of our work studies typical movement in order to help when it goes wrong. Knowing how a healthy nervous system coordinates and recalibrates movement tells us what a rehabilitation tool should encourage after a stroke, and what to look for when balance or gait starts to fail.

      We approach both as engineers. We build models of the sensorimotor system and test them against recordings of muscle activity and movement. We also build our own instruments, because the measurements we need are often expensive or tied to a specialised lab. Making them cheap and portable enough to use outside the lab is a goal in its own right.

  publications:
