  home:
    tagline: "Estudiamos cómo se produce y se controla el movimiento, y usamos lo que aprendemos para ayudar a las personas a recuperarlo."
    cta_research: "Nuestra investigación"
    cta_join: "Trabajar con nosotros"
    about_title: "Sobre el laboratorio"
    about_lede: "Modelamos el cuerpo y el sistema nervioso, desarrollamos instrumentos de bajo costo para medir el movimiento fuera del laboratorio, y diseñamos herramientas de rehabilitación para personas que se recuperan de lesiones neurológicas como el ACV."
    about_body: "Somos parte de la Facultad de Ingeniería y Tecnologías de la Universidad Católica del Uruguay, y trabajamos con los grupos de microelectrónica, informática y fisioterapia de la UCU, y con Duke University."
    figure_label: "Fotogramas de un ciclo de marcha con marcadores de captura de movimiento, sobre los ángulos de flexión de rodilla y cadera"
    figure_caption: "Un ciclo de marcha de la pierna derecha en el plano sagital, con la flexión de rodilla y cadera (forma normativa, esquema)."
    lines_title: "Líneas de investigación"
    projects_title: "Proyectos en curso"
    band: "Trabajamos con <strong>Duke University</strong>, la <strong>Universidad Iberoamericana</strong> y los grupos de <strong>microelectrónica (μDIE)</strong>, <strong>informática</strong> y <strong>fisioterapia</strong> de la UCU, en proyectos financiados por <strong>ANII</strong> y los <strong>Institutos Nacionales de Salud de EE. UU.</strong>"
    pubs_title: "Publicaciones y preprints recientes"
    team_title: "Equipo"
    team_card_title: "Estudiantes, egresados y colaboradores"
    team_card_text: "GRAD estudiantes de posgrado, UGRAD estudiantes de grado en iniciación a la investigación, ALUMNI egresados y COLLAB colaboradores en la UCU, Duke University y otras instituciones."
    join_title: "¿Le interesa colaborar o sumarse al laboratorio?"
    join_text: "Si le interesa hacer una tesis con nosotros, colaborar en un proyecto o plantearnos una pregunta clínica sobre el movimiento, escriba a cualquiera de los investigadores principales con unas líneas sobre su formación y sobre qué le gustaría trabajar."

  research:
    lede: "Buscamos entender cómo se produce y se controla el movimiento, y usar ese conocimiento para ayudar a las personas a moverse mejor. Esto abarca la mecánica del cuerpo, cómo el sistema nervioso coordina los músculos, y cómo usa la información visual, vestibular y propioceptiva para mantener el equilibrio y adaptarse cuando cambian las condiciones."
    approach: |-
      Buena parte de nuestro trabajo estudia el movimiento típico para poder intervenir cuando algo falla. Saber cómo un sistema nervioso sano coordina y recalibra el movimiento nos indica qué debería promover una herramienta de rehabilitación después de un ACV, y qué buscar cuando el equilibrio o la marcha empiezan a deteriorarse.

      Abordamos ambas cosas desde la ingeniería. Construimos modelos del sistema sensoriomotor y los contrastamos con registros de actividad muscular y de movimiento. También desarrollamos nuestros propios instrumentos, porque las mediciones que necesitamos suelen ser caras o requerir un laboratorio especializado. Que sean de bajo costo y lo bastante portátiles para usarse fuera del laboratorio es un objetivo en sí mismo.

  publications:
    lede: "Artículos y preprints de las líneas de investigación del laboratorio, actualizados mensualmente desde los perfiles ORCID de sus integrantes. Integrantes del laboratorio en negrita."

