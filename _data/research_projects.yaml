- id: emg-synergy-training
  title_en: Interactive tool for the visualization and training of muscle synergies
  title_es: Herramienta interactiva para la visualización y el entrenamiento de sinergias musculares
  summary_en: >-
    A human-computer interface in which surface EMG moves an on-screen cursor only when the muscles are recruited in a specific coordination pattern, to train muscle synergies for motor rehabilitation.
  summary_es: >-
    Una interfaz humano-computadora en la que la EMG de superficie mueve un cursor en pantalla solo cuando los músculos se reclutan con un patrón de coordinación específico, para entrenar sinergias musculares con fines de rehabilitación motora.
  body_en: |-
    The nervous system does not control each muscle independently. Muscle activity during a movement can be described as the combination of a few muscle synergies, groups of muscles activated together ([d'Avella et al., 2003](https://doi.org/10.1038/nn1010)). After a stroke these synergies often change: in many patients some of them merge, and muscle coordination becomes less complex ([Clark et al., 2010](https://doi.org/10.1152/jn.00825.2009); [Cheung et al., 2012](https://doi.org/10.1073/pnas.1212056109)).

    We built an interface in which the activity of several muscles, recorded with surface EMG, controls a cursor on a screen, but only when the muscles are recruited in a given coordination pattern. Moving the cursor therefore requires producing that pattern, which can be chosen to differ from the user's habitual one. The goal is a rehabilitation tool that trains muscle coordination and leaves a lasting change in how the nervous system controls those muscles, not only during the session.
  body_es: |-
    El sistema nervioso no controla cada músculo por separado. La actividad muscular durante un movimiento puede describirse como la combinación de unas pocas sinergias musculares, grupos de músculos que se activan en conjunto ([d'Avella et al., 2003](https://doi.org/10.1038/nn1010)). Después de un ACV estas sinergias suelen cambiar: en muchos pacientes algunas se fusionan, y la coordinación muscular se vuelve menos compleja ([Clark et al., 2010](https://doi.org/10.1152/jn.00825.2009); [Cheung et al., 2012](https://doi.org/10.1073/pnas.1212056109)).

    Desarrollamos una interfaz en la que la actividad de varios músculos, registrada con EMG de superficie, controla un cursor en pantalla, pero solo cuando los músculos se reclutan con un patrón de coordinación determinado. Para mover el cursor hay que producir ese patrón, que puede elegirse distinto del habitual de la persona. El objetivo es una herramienta de rehabilitación que entrene la coordinación muscular y deje un cambio duradero en cómo el sistema nervioso controla esos músculos, no solo durante la sesión.
