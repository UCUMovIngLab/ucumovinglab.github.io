- id: markerless-mocap
  title_en: Real-time markerless motion capture on edge devices
  title_es: Captura de movimiento sin marcadores en tiempo real en dispositivos de borde
  summary_en: >-
    3D pose estimation from several synchronised cameras, processed in real time on small embedded computers, as a low-cost alternative to marker-based motion capture for gait and movement analysis.
  summary_es: >-
    Estimación de la pose en 3D a partir de varias cámaras sincronizadas, procesada en tiempo real en computadoras embebidas pequeñas, como alternativa de bajo costo a la captura de movimiento con marcadores para el análisis de la marcha y del movimiento.
  body_en: |-
    Optical motion capture with reflective markers is the reference method for measuring movement in 3D, but it is expensive and needs a dedicated lab. Each session also takes time: markers have to be placed on anatomical landmarks, and the results depend on where they are placed. This limits how often, and where, movement can be measured.

    Markerless methods estimate the positions of body keypoints directly from video, with neural networks trained for pose estimation. With two or more calibrated cameras, the 2D keypoints can be triangulated into 3D. Two questions decide whether this is useful for movement analysis: accuracy, which depends on how many cameras are used and where they are placed, and speed, since uses such as real-time feedback need results while the person moves, not after offline processing.

    We are building a multi-camera system that runs pose estimation on edge devices, small embedded computers at the point of capture, aiming at 100 frames per second, and measuring how its accuracy changes with the number and geometry of the cameras (Ottonelli and Iturralde, IEEE URUCON 2026, poster).
  body_es: |-
    La captura óptica de movimiento con marcadores reflectivos es el método de referencia para medir el movimiento en 3D, pero es cara y requiere un laboratorio dedicado. Cada sesión además lleva tiempo: hay que colocar los marcadores sobre referencias anatómicas, y los resultados dependen de dónde se coloquen. Esto limita con qué frecuencia, y dónde, se puede medir el movimiento.

    Los métodos sin marcadores estiman la posición de puntos clave del cuerpo directamente a partir de video, con redes neuronales entrenadas para estimar la pose. Con dos o más cámaras calibradas, los puntos clave en 2D se pueden triangular en 3D. Dos cuestiones determinan si esto sirve para el análisis del movimiento: la exactitud, que depende de cuántas cámaras se usan y dónde se ubican, y la velocidad, ya que usos como la retroalimentación en tiempo real necesitan resultados mientras la persona se mueve y no después de un procesamiento diferido.

    Estamos desarrollando un sistema de múltiples cámaras que ejecuta la estimación de pose en dispositivos de borde, computadoras embebidas pequeñas en el punto de captura, con el objetivo de llegar a 100 cuadros por segundo, y estamos midiendo cómo cambia su exactitud con el número y la geometría de las cámaras (Ottonelli e Iturralde, IEEE URUCON 2026, póster).
