- id: imov-cattle-monitoring
  title_en: "iMov: monitoring cattle using sensors"
  title_es: "iMov: monitoreo de ganado vacuno mediante sensores"
  summary_en: >-
    Ear tags with accelerometers, tested in long-term field trials, to monitor the health and productive condition of cattle in grazing, dairy and feedlot systems. A multidisciplinary project led by UCU's μDIE microelectronics group, to which the lab contributes its experience in measuring and analysing movement.
  summary_es: >-
    Caravanas con acelerómetro, evaluadas en pruebas de campo de largo plazo, para monitorear la condición sanitaria y productiva del ganado vacuno en sistemas pastoriles, de lechería y de feedlot. Proyecto multidisciplinario liderado por el grupo de microelectrónica μDIE de la UCU, al que el laboratorio aporta su experiencia en la medición y el análisis del movimiento.
  body_en: |-
    Electronic ear tags already identify each animal in Uruguay's national cattle traceability system. Adding an accelerometer turns the tag into a behaviour sensor: how much an animal rests, moves, feeds and ruminates, and how those patterns change with its health or when it is in heat. The electronics exist and can be made cheaply, but producers still lack open, field-tested tools that link these signals to the conditions they care about.

    The project will develop a miniaturised, low-power ear tag with an accelerometer and on-device processing, build labelled datasets of basic behaviours (resting, moving, feeding, ruminating), and run field trials over its five years in the three main cattle production systems in Uruguay: grazing, dairy and feedlot. It brings together electronics, data science and artificial intelligence with veterinary and agricultural sciences.
  body_es: |-
    Las caravanas electrónicas ya identifican a cada animal en el sistema nacional de trazabilidad del ganado vacuno del Uruguay. Si se les agrega un acelerómetro, se convierten en un sensor de comportamiento: cuánto descansa, se desplaza, come y rumia un animal, y cómo cambian esos patrones con su estado sanitario o cuando está en celo. La electrónica existe y puede ser de bajo costo, pero el productor todavía no cuenta con herramientas abiertas y probadas en campo que relacionen estas señales con las condiciones que le interesan.

    El proyecto desarrollará una caravana miniaturizada de bajo consumo, con acelerómetro y procesamiento en el propio dispositivo, construirá conjuntos de datos etiquetados de comportamientos básicos (reposo, desplazamiento, ingesta y rumia), y hará pruebas de campo a lo largo de sus cinco años en los tres sistemas de producción ganadera principales del Uruguay: pastoril, lechería y feedlot. Combina electrónica, ciencia de datos e inteligencia artificial con las ciencias veterinarias y agronómicas.
