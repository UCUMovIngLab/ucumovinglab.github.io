- id: walking-perception
  title_en: Perception of leg speed and locomotor adaptation
  title_es: Percepción de la velocidad de las piernas y adaptación locomotora
  summary_en: >-
    How accurately people perceive differences in speed between their legs while walking, and how that perception shapes the way they adapt their gait. We combine psychophysics on a split-belt treadmill with computational models of perceptual decisions (drift-diffusion, Bayesian).
  summary_es: >-
    Qué tan bien perciben las personas las diferencias de velocidad entre sus piernas al caminar, y cómo esa percepción influye en la forma en que adaptan su marcha. Combinamos psicofísica en una cinta de doble banda con modelos computacionales de decisiones perceptuales (difusión con deriva, bayesianos).
  body_en: |-
    On a split-belt treadmill each leg is driven at a different speed. People adapt within a few minutes, and when the belts return to the same speed they walk asymmetrically for a while, an aftereffect that shows the nervous system has recalibrated its motor commands. Sensory information drives this recalibration, but in these paradigms perception has been measured far less than movement, because it is internal and harder to observe.

    We measure it with two-alternative forced-choice tasks: participants walk and report which leg feels faster, over many repetitions of different speed differences. Walking at 1.05 m/s, people correctly identified a difference of about 50 mm/s in 75% of trials (a Weber fraction of 4.7%), smaller than previously reported. A drift-diffusion model, which treats each decision as noisy evidence accumulating over time, predicted their choices from their reaction times alone ([Gonzalez-Rubio et al., 2025](https://doi.org/10.1523/ENEURO.0343-23.2025)).

    Sensitivity changes with walking speed: it scales as Weber's law predicts at slow and fast speeds, but not near comfortable speed ([Gonzalez-Rubio et al., 2026](https://doi.org/10.1038/s41598-026-54948-5)). During adaptation, perceptual sensitivity predicted the early motor corrections, and perceptual errors, the mismatch between perceived and actual leg speed, predicted the size of the aftereffects ([Gonzalez-Rubio et al., 2026, preprint](https://doi.org/10.64898/2026.08.01.742204)). This identifies perceived limb motion as a behavioural proxy for the prediction errors that error-based learning assumes drive adaptation.
  body_es: |-
    En una cinta de doble banda cada pierna se mueve a una velocidad distinta. Las personas se adaptan en pocos minutos, y cuando las bandas vuelven a la misma velocidad caminan de forma asimétrica durante un tiempo, un efecto residual que muestra que el sistema nervioso recalibró sus comandos motores. La información sensorial impulsa esa recalibración, pero en estos paradigmas la percepción se ha medido mucho menos que el movimiento, porque es interna y más difícil de observar.

    La medimos con tareas de elección forzada entre dos alternativas: los participantes caminan e indican qué pierna sienten más rápida, en muchas repeticiones de distintas diferencias de velocidad. Caminando a 1,05 m/s, las personas identificaron correctamente una diferencia de unos 50 mm/s en el 75 % de los ensayos (una fracción de Weber de 4,7 %), menor que la reportada hasta entonces. Un modelo de difusión con deriva, que trata cada decisión como la acumulación ruidosa de evidencia en el tiempo, predijo sus respuestas solo a partir de los tiempos de reacción ([Gonzalez-Rubio et al., 2025](https://doi.org/10.1523/ENEURO.0343-23.2025)).

    La sensibilidad cambia con la velocidad de marcha: escala como predice la ley de Weber a velocidades lentas y rápidas, pero no cerca de la velocidad cómoda ([Gonzalez-Rubio et al., 2026](https://doi.org/10.1038/s41598-026-54948-5)). Durante la adaptación, la sensibilidad perceptual predijo las correcciones motoras tempranas, y los errores perceptuales, es decir, la diferencia entre la velocidad percibida y la real, predijeron la magnitud de los efectos residuales ([Gonzalez-Rubio et al., 2026, preprint](https://doi.org/10.64898/2026.08.01.742204)). Esto identifica al movimiento percibido de las piernas como un indicador conductual de los errores de predicción que, según el aprendizaje basado en errores, impulsan la adaptación.
