- id: tms-neuronavigation
  title_en: Markerless neuronavigation for transcranial magnetic stimulation
  title_es: Neuronavegación sin marcadores para estimulación magnética transcraneal
  summary_en: >-
    Tracking the head and the stimulation coil during transcranial magnetic stimulation (TMS) with low-cost visible and infrared cameras and a model of facial geometry, instead of markers attached to the patient, to make neuronavigation cheaper, quicker to set up and more comfortable.
  summary_es: >-
    Seguimiento de la cabeza y de la bobina durante la estimulación magnética transcraneal (EMT) con cámaras de luz visible e infrarroja de bajo costo y un modelo de la geometría facial, en lugar de marcadores fijados al paciente, para que la neuronavegación sea más barata, más rápida de preparar y más cómoda.
  body_en: |-
    Transcranial magnetic stimulation (TMS) induces electric currents in the brain with a coil held against the head. Its effect depends on where and how the coil is placed, so research and clinical protocols use neuronavigation: a tracking system follows the head and the coil, and shows the coil's position relative to a target defined on images of the patient's brain.

    Conventional neuronavigation tracks markers with a dedicated optical camera. The markers worn on the head have to be registered by hand at the start of each session, can shift during the procedure and are uncomfortable, and the tracking hardware is expensive. These costs limit where neuronavigated TMS is available.

    We replace them with low-cost visible and infrared cameras, with stereo and depth sensing, and algorithms that model the geometry of the face. In a validation with 50 participants, the best markerless method differed from a conventional marker-based system by a median of 2.32 mm and 2.01°, which indicates sufficient accuracy for TMS and improves substantially on earlier markerless results ([Xie et al., 2026](https://arxiv.org/abs/2602.07052)). The results also suggest that combining the data from the different camera sensors can improve accuracy further.
  body_es: |-
    La estimulación magnética transcraneal (EMT) induce corrientes eléctricas en el cerebro mediante una bobina apoyada sobre la cabeza. Su efecto depende de dónde y cómo se coloca la bobina, por eso los protocolos clínicos y de investigación usan neuronavegación: un sistema de seguimiento sigue la cabeza y la bobina, y muestra la posición de la bobina respecto de un objetivo definido en imágenes del cerebro del paciente.

    La neuronavegación convencional sigue marcadores con una cámara óptica específica. Los marcadores que se colocan en la cabeza requieren un registro manual al inicio de cada sesión, pueden desplazarse durante el procedimiento y resultan incómodos, y el equipo de seguimiento es caro. Estos costos limitan dónde se puede ofrecer EMT neuronavegada.

    Los reemplazamos por cámaras de luz visible e infrarroja de bajo costo, con visión estéreo y sensado de profundidad, y algoritmos que modelan la geometría del rostro. En una validación con 50 participantes, el mejor método sin marcadores difirió de un sistema convencional con marcadores en una mediana de 2,32 mm y 2,01°, una exactitud suficiente para EMT y una mejora sustancial respecto de resultados previos sin marcadores ([Xie et al., 2026](https://arxiv.org/abs/2602.07052)). Los resultados sugieren además que combinar los datos de los distintos sensores de las cámaras puede mejorar aún más la exactitud.
