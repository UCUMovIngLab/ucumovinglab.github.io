- id: emg-synergy-training
  title_en: Interactive tool for the visualization and training of muscle synergies
  title_es: Herramienta interactiva para la visualización y el entrenamiento de sinergias musculares
  summary_en: >-
    A human-computer interface in which surface EMG controls an on-screen cursor only when the muscles
    are recruited in a specific coordination pattern, to train muscle synergies for motor rehabilitation.
  summary_es: >-
    Una interfaz humano-computadora en la que la EMG de superficie controla un cursor en pantalla solo
    cuando los músculos se reclutan con un patrón de coordinación específico, para entrenar sinergias
    musculares con fines de rehabilitación motora.
  line: rehabilitation
  status: finished
  start: 2022
  end: 2025
  people:
    - { person: pablo-iturralde, role: pi }
    - { person: enrique-ferreira, role: researcher }
    - { person: juan-gandolfo, role: student }
    - { person: melissa-imbert, role: student }
  funding:
    - funder: ANII
      program: Fondo María Viñas
      code: FMV_3_2022_1_172858
      url: https://www.anii.org.uy
  outputs:
    - doi:10.1109/URUCON63440.2024.10850101
