- id: imu-ranging
  title_en: Wearable inertial sensors with ranging for relative positioning
  title_es: Sensores inerciales vestibles con medición de distancia para posicionamiento relativo
  summary_en: >-
    Position integrated from inertial measurement units (IMUs) drifts within seconds, so IMUs alone cannot tell where one limb is relative to another. We add a direct distance measurement between wearable sensors to constrain that drift. Gait analysis outside the laboratory is the first application.
  summary_es: >-
    La posición que se obtiene integrando las señales de unidades de medición inercial (IMU) deriva en pocos segundos, por lo que las IMU por sí solas no pueden decir dónde está un miembro respecto de otro. Agregamos una medición directa de distancia entre sensores vestibles para acotar esa deriva. La primera aplicación es el análisis de la marcha fuera del laboratorio.
  body_en: |-
    An IMU measures acceleration and angular velocity, not position. To get position, the gyroscope signal is integrated to track orientation, the orientation is used to subtract gravity from the accelerometer signal, and the result is integrated twice. Sensor bias and noise are integrated along with the signal, so the error grows quickly: a constant accelerometer bias produces a position error that grows with the square of time, and a constant gyroscope bias tilts the orientation estimate, leaks gravity into the horizontal acceleration and produces an error that grows with the cube of time ([Woodman, 2007](https://www.cl.cam.ac.uk/techreports/UCAM-CL-TR-696.html)). With the low-cost sensors used in wearables, position integrated this way is usable for only a few seconds before drift dominates.

    For sensors on the feet, the usual remedy is to reset the velocity to zero whenever the foot is flat on the ground ([Foxlin, 2005](https://doi.org/10.1109/MCG.2005.140)). That keeps each foot's trajectory usable over a stride, but each sensor still accumulates its own heading error, and nothing links one foot's estimate to the other's. Quantities that depend on where the limbs are relative to each other, such as step width or the distance between the feet through the gait cycle, cannot be estimated reliably from IMUs alone.

    We add a direct measurement of the distance between sensors. A range measurement does not accumulate error, so fusing it with the inertial data constrains the error in the relative position between them. Our prototype is a pair of wireless, battery-powered nodes worn on the ankles, each with a 9-axis IMU and 40 kHz ultrasonic transducers; the distance between nodes comes from the round-trip time of flight of ultrasonic pulses. The nodes are designed to record for at least 16 hours per charge. Ultrasonic ranging between the feet has been combined with inertial sensing before ([Weenk et al., 2015](https://doi.org/10.1109/TNSRE.2014.2357686)), and ultra-wideband radio is a common alternative for ranging between wearable sensors ([Armani et al., 2024](https://doi.org/10.1145/3641519.3657465)).

    The first application is gait analysis outside the laboratory: step length and step width over hours of everyday walking, rather than a few strides on a walkway, for clinical uses such as diagnosis and tracking the effects of rehabilitation. The same principle applies to other pairs of body segments whose relative position matters. Current work characterises the ranging hardware against optical motion capture, and estimates step length and step width from two foot-mounted IMUs and a single range channel.
  body_es: |-
    Una IMU mide aceleración y velocidad angular, no posición. Para obtener la posición, se integra la señal del giróscopo para seguir la orientación, se usa esa orientación para restar la gravedad de la señal del acelerómetro, y el resultado se integra dos veces. El sesgo y el ruido de los sensores se integran junto con la señal, por lo que el error crece rápido: un sesgo constante del acelerómetro produce un error de posición que crece con el cuadrado del tiempo, y un sesgo constante del giróscopo inclina la estimación de la orientación, filtra parte de la gravedad a la aceleración horizontal y produce un error que crece con el cubo del tiempo ([Woodman, 2007](https://www.cl.cam.ac.uk/techreports/UCAM-CL-TR-696.html)). Con los sensores de bajo costo que se usan en dispositivos vestibles, la posición integrada de esta forma sirve apenas unos segundos antes de que domine la deriva.

    Para sensores en los pies, la solución habitual es llevar la velocidad a cero cada vez que el pie está apoyado en el piso ([Foxlin, 2005](https://doi.org/10.1109/MCG.2005.140)). Así la trayectoria de cada pie se mantiene utilizable a lo largo de una zancada, pero cada sensor sigue acumulando su propio error de rumbo, y nada vincula la estimación de un pie con la del otro. Las magnitudes que dependen de la posición de un miembro respecto de otro, como el ancho del paso o la distancia entre los pies a lo largo del ciclo de marcha, no se pueden estimar de forma confiable solo con IMU.

    Agregamos una medición directa de la distancia entre sensores. Una medición de distancia no acumula error, así que al fusionarla con los datos inerciales se acota el error en la posición relativa entre ellos. Nuestro prototipo es un par de nodos inalámbricos a batería que se colocan en los tobillos, cada uno con una IMU de 9 ejes y transductores de ultrasonido de 40 kHz; la distancia entre nodos se obtiene del tiempo de vuelo de ida y vuelta de pulsos de ultrasonido. Los nodos están diseñados para registrar al menos 16 horas con una carga. La medición de distancia por ultrasonido entre los pies ya se combinó antes con sensores inerciales ([Weenk et al., 2015](https://doi.org/10.1109/TNSRE.2014.2357686)), y la medición por radio de banda ultraancha (UWB) es una alternativa frecuente para medir distancias entre sensores vestibles ([Armani et al., 2024](https://doi.org/10.1145/3641519.3657465)).

    La primera aplicación es el análisis de la marcha fuera del laboratorio: el largo y el ancho del paso durante horas de marcha cotidiana, y no solo en unos pocos pasos sobre una pasarela, con usos clínicos como el diagnóstico y el seguimiento de los efectos de la rehabilitación. El mismo principio se aplica a otros pares de segmentos corporales cuya posición relativa interesa. El trabajo actual caracteriza el hardware de medición de distancia frente a captura óptica de movimiento, y estima el largo y el ancho del paso a partir de dos IMU en los pies y un único canal de distancia.
