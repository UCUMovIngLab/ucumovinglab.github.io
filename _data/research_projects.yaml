- id: markerless-mocap
  title_en: Real-time markerless motion capture
  title_es: Captura de movimiento sin marcadores en tiempo real
  summary_en: >-
    Pose estimation from video with computer vision, run in real time on edge devices, as an
    accessible alternative to marker-based motion capture for movement analysis.
  summary_es: >-
    Estimación de pose a partir de video mediante visión por computadora, ejecutada en tiempo real en
    dispositivos de borde, como alternativa accesible a la captura de movimiento con marcadores para el
    análisis del movimiento.
  line: digitalization
  status: active
  start: 2025
  people:
    - { person: pablo-iturralde, role: pi }
    - { person: juan-ottonelli, role: student }
    - { person: sofia-ibarra, role: student }
    - { person: matihas-sastre, role: student }
    - { person: facundo-diaz, role: student }
    - { person: lucas-handalian, role: researcher }
  # outputs: poster at IEEE URUCON 2026 (J. Ottonelli), not indexed.

- id: imu-ranging
  title_en: Wearable inertial and ultrasonic ranging sensors for gait analysis
  title_es: Sensores vestibles inerciales y de distancia por ultrasonido para análisis de la marcha
  summary_en: >-
    Ankle-worn devices that combine inertial measurement units (IMUs) with ultrasonic time-of-flight
    ranging between the legs, to estimate step length and step width outside the laboratory.
  summary_es: >-
    Dispositivos colocados en los tobillos que combinan unidades de medición inercial (IMU) con
    medición de distancia entre las piernas por tiempo de vuelo de ultrasonido, para estimar el largo y
    el ancho del paso fuera del laboratorio.
  line: digitalization
  status: active
  start: 2023
  people:
    - { person: pablo-iturralde, role: pi }
    - { person: matias-miguez, role: researcher }
    - { person: diego-barboza, role: student }
    - { person: nicole-imbert, role: student }
    - { person: mathias-ferreira, role: student }
  # outputs: poster at 3DAHM 2024 (no DOI); two papers at IEEE URUCON 2026 (#1571336082 accepted,
  # #1571336230 pending). Add their DOIs once published.

