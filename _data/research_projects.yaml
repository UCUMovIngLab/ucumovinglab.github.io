- id: knee-exoskeleton
  title_en: Powered knee orthosis for gait rehabilitation
  title_es: Órtesis de rodilla actuada para rehabilitación de la marcha
  summary_en: >-
    A motor-driven knee orthosis that moves the knee along a walking trajectory, and the robust control it needs to follow that trajectory when the dynamics of the leg and the device are uncertain.
  summary_es: >-
    Una órtesis de rodilla accionada por motor que mueve la rodilla siguiendo una trayectoria de marcha, y el control robusto que necesita para seguir esa trayectoria cuando la dinámica de la pierna y del dispositivo es incierta.
  body_en: |-
    Recovering walking after a stroke or other neurological injury relies on intensive, repetitive practice. A powered orthosis can assist the knee through that practice consistently and over long sessions.

    Control is the hard part. The orthosis has to follow a physiological knee-angle trajectory while the load on the joint changes over the gait cycle and from one person to the next, and while friction, unmodelled dynamics and the interaction with the leg act as disturbances. A controller tuned for one condition can track poorly in another.

    We described the first version of the device in [Handalian et al. (2025)](https://doi.org/10.1109/CODIT66093.2025.11321529). The current version runs its control loop on an embedded microcontroller at 1 kHz, with a hybrid controller: sliding-mode control combined with an extended state observer that estimates the lumped disturbance in real time so that it can be cancelled. In bench tests with the orthosis unloaded, following a knee-angle trajectory recorded during walking, it tracked with lower error, less undershoot and lower control effort than a conventional PI-D controller (Handalian et al., IEEE URUCON 2026, accepted).
  body_es: |-
    Recuperar la marcha después de un ACV u otra lesión neurológica depende de una práctica intensiva y repetitiva. Una órtesis actuada puede asistir la rodilla durante esa práctica de forma consistente y en sesiones largas.

    La dificultad está en el control. La órtesis tiene que seguir una trayectoria fisiológica del ángulo de rodilla mientras la carga sobre la articulación cambia a lo largo del ciclo de marcha y de una persona a otra, y mientras la fricción, la dinámica no modelada y la interacción con la pierna actúan como perturbaciones. Un controlador ajustado para una condición puede seguir mal la trayectoria en otra.

    Describimos la primera versión del dispositivo en [Handalian et al. (2025)](https://doi.org/10.1109/CODIT66093.2025.11321529). La versión actual ejecuta el lazo de control en un microcontrolador embebido a 1 kHz, con un controlador híbrido: control por modos deslizantes combinado con un observador de estado extendido que estima en tiempo real la perturbación total para poder compensarla. En ensayos de banco con la órtesis sin carga, siguiendo una trayectoria del ángulo de rodilla registrada durante la marcha, tuvo menor error de seguimiento, menos subimpulso y menor esfuerzo de control que un controlador PI-D convencional (Handalian et al., IEEE URUCON 2026, aceptado).
